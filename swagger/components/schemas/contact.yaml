# swagger/components/schemas/contact.yaml

type: object
required:
  - _id
  - name
  - phoneNumber
  - email
  - isFavourite
  - contactType
  - userId
  - photo
properties:
  _id:
    description: "Contact's id"
    type: string
    example: 65e4decdd286b30065d54af9
  name:
    description: "Contact's name"
    type: string
    example: 'John Doe'
  phoneNumber:
    description: "Contact's phone number"
    type: number
    example: '+380000000000'
  email:
    description: "Contact's email"
    type: string
    example: 'example@example.com'
  isFavourite:
    description: 'Status of contact as favorite'
    type: boolean
    example: true
    default: false
  contactType:
    description: 'Type of contact'
    type: string
    enum: ['work', 'home', 'personal']
    example: 'work'
  userId:
    description: 'Id of user who created the contact'
    type: string
    example: 65e4decdd286b30065d54af9
  createdAt:
    description: 'Date when contact was created'
    type: string
    example: '2025-08-06T16:51:13.468+00:00'
  updatedAt:
    description: 'Date when contact was last updated'
    type: string
    example: '2025-08-06T16:51:13.468+00:00'
  photo:
    description: "URL of contact's photo"
    type: string
    format: binary
    example: 'https://res.cloudinary.com/dx8bwzupf/image/upload/v1754587551/k5bdp6pi…'
