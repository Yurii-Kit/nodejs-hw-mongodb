tags:
  - Contacts
summary: Update contact by ID
operationId: updateContactById
description: 'Update contact by ID using multipart/form-data'
security:
  - bearerAuth: []
parameters:
  - in: path
    name: contactId
    required: true
    schema:
      type: string
      example: '65ca67e7ae7f10c88b598384'
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
            example: Robin Updated
          phoneNumber:
            type: string
            example: '+380000000001'
          email:
            type: string
            example: 'robin.updated@example.com'
          isFavourite:
            type: boolean
            example: true
          contactType:
            type: string
            enum: [personal, work, other]
            example: personal
          photo:
            type: string
            format: binary
            description: Upload new contact photo
responses:
  '200':
    description: 'Contact updated successfully'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully updated contact with id 65ca67e7ae7f10c88b598384!
            data:
              $ref: '../../../components/schemas/contact.yaml'

  '401':
    $ref: '../../../components/responses/401.yaml'
  '404':
    $ref: '../../../components/responses/404.yaml'
